[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paperwiki"
version = "0.6.0"
description = "논문 PDF 를 Claude Code 가 읽고 제안한 주장·키워드를 검토해 개인 위키로 쌓는 도구 (Claude Code 스킬 + 구글 드라이브 + Zotero + 웹 탐색)"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
    "keyring>=24",
    "pypdf>=4",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
paperwiki = "paperwiki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperwiki = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
